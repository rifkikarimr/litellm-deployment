model_list:
  # Stable client-facing alias. Callers do not need provider-specific names.
  - model_name: general-chat
    litellm_params:
      model: os.environ/PRIMARY_MODEL
      api_key: os.environ/OPENAI_API_KEY
    model_info:
      id: openai-primary
      mode: chat
      provider: openai

  # Direct aliases make provider validation explicit without changing general-chat.
  - model_name: openai-direct
    litellm_params:
      model: os.environ/PRIMARY_MODEL
      api_key: os.environ/OPENAI_API_KEY
    model_info:
      id: openai-direct
      mode: chat
      provider: openai

  - model_name: gemini-direct
    litellm_params:
      model: os.environ/FALLBACK_MODEL
      api_key: os.environ/GEMINI_API_KEY
      additional_drop_params:
        - temperature
        - top_p
        - top_k
    model_info:
      id: gemini-fallback
      mode: chat
      provider: gemini

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  database_url: os.environ/DATABASE_URL
  database_connection_pool_limit: 10
  allow_requests_on_db_unavailable: false

router_settings:
  routing_strategy: simple-shuffle
  timeout: 30
  num_retries: 2
  retry_after: 1
  allowed_fails: 3
  cooldown_time: 60
  fallbacks:
    - general-chat:
        - gemini-direct
  retry_policy:
    AuthenticationErrorRetries: 0
    BadRequestErrorRetries: 0
    ContentPolicyViolationErrorRetries: 0
    TimeoutErrorRetries: 2
    RateLimitErrorRetries: 2
    InternalServerErrorRetries: 2

litellm_settings:
  callbacks:
    - langfuse_otel
  json_logs: true
  set_verbose: false
